<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />

  <meta property="og:title" content="수북수북 | Subook Book">
  <meta property="og:image" content="https://cdn.jsdelivr.net/gh/Junkyuh/subooksubook-assets/logo.png">

  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;500&display=swap" rel="stylesheet">

  <!-- 성능 최적화: CDN 사전 연결 및 LCP 배경 이미지 미리 로드 -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
  <link rel="preload" as="image" href="https://cdn.jsdelivr.net/gh/Junkyuh/subooksubook-assets/webp_only/DJI_20251114143734_0533_D.webp" fetchpriority="high" />
  <link rel="preload" as="image" href="https://cdn.jsdelivr.net/gh/Junkyuh/subooksubook-assets/webp_only/DJI_20251114143838_0537_D.webp" />

  <style>
    /* === 초기화 및 변수 === */
    :root {
      --primary: #f5f5f7;
      --background: #000000;
      --accent: #d4b886;
      --accent-rgb: 212, 184, 134;
      --card-bg: rgba(22, 22, 23, 0.45);
      --card-border: rgba(255, 255, 255, 0.06);
      --font-serif: 'Noto Serif KR', serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--primary);
      background-color: var(--background);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.02em;
    }

    /* === 파격적인 스플릿 레이아웃 설계 === */
    .container {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    
    @media (min-width: 1024px) {
      .container {
        flex-direction: row;
        height: 100vh;
        overflow: hidden;
      }
    }

    /* 왼쪽 고정 영역 (히어로 & 비주얼) */
    .left-panel {
      position: relative;
      padding: 60px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      min-height: 40vh;
      overflow: hidden;
    }

    @media (min-width: 1024px) {
      .left-panel {
        width: 45%;
        height: 100vh;
        min-height: auto;
        padding: 80px;
        position: sticky;
        top: 0;
      }
    }

    /* 비주얼 가독성을 위한 오버레이 베일 */
    .left-panel::after {
      content: "";
      position: absolute; inset: 0;
      background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.4) 100%),
                  linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.3));
      z-index: -1;
      pointer-events: none;
    }

    /* 배경 레이어 (드론샷) */
    .bg-layer {
      position: absolute; inset: 0;
      z-index: -2;
      background-image: url('https://cdn.jsdelivr.net/gh/Junkyuh/subooksubook-assets/webp_only/DJI_20251114143734_0533_D.webp');
      background-size: cover;
      background-position: center;
      filter: brightness(0.3) contrast(1.15);
      transform: scale(1.03);
      animation: slowZoom 45s infinite alternate ease-in-out;
      will-change: transform, filter;
    }
    @keyframes slowZoom { from { transform: scale(1.02); } to { transform: scale(1.08); } }

    /* CSS 기반 은은한 골드 파티클 컨테이너 */
    .particles-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: -1;
    }
    .gold-particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent), 0 0 16px var(--accent);
      opacity: 0;
      animation: floatParticle 9s infinite ease-in-out;
    }
    @keyframes floatParticle {
      0% { transform: translateY(105vh) translateX(0) scale(0.7); opacity: 0; }
      15% { opacity: 0.6; }
      85% { opacity: 0.6; }
      100% { transform: translateY(-10vh) translateX(60px) scale(1.2); opacity: 0; }
    }

    /* 로고 & 타이틀 */
    .logo-area {
      margin-bottom: 16px;
    }
    .logo-img {
      width: 64px;
      height: auto;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.4));
    }
    .title-area span {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--accent);
      margin-bottom: 8px;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(30px, 5.5vw, 44px);
      font-weight: 300;
      line-height: 1.25;
      color: #ffffff;
      text-shadow: 0 4px 30px rgba(0, 0, 0, 0.7);
    }
    


    /* 오른쪽 스크롤 영역 */
    .right-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #000000;
    }

    @media (min-width: 1024px) {
      .right-panel {
        height: 100vh;
        overflow-y: auto;
        scroll-behavior: smooth;
        padding-right: 8px;
      }
      .right-panel::-webkit-scrollbar { width: 6px; }
      .right-panel::-webkit-scrollbar-track { background: #000; }
      .right-panel::-webkit-scrollbar-thumb { background: #1c1c1e; border-radius: 3px; }
      .right-panel::-webkit-scrollbar-thumb:hover { background: #2c2c2e; }
    }

    /* 오른쪽 패널 콘텐츠 패딩 */
    .right-content {
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    /* === 스크롤 reveal 애니메이션 === */
    .reveal {
      opacity: 0;
      transform: translateY(35px);
      transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform, opacity;
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* === 링크 카드 그리드 === */
    .links-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      width: 100%;
      margin-bottom: 60px;
    }

    @media (min-width: 640px) {
      .links-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 18px;
      }
    }

    /* 럭셔리 고사양 글래스모피즘 링크 카드 */
    .link-card {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 110px;
      padding: 20px;
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      text-decoration: none;
      color: #ffffff;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25),
                  inset 0 1px 1px rgba(255, 255, 255, 0.08); /* 내측 하이라이트 추가 */
    }
    .link-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.12), transparent);
    }
    .link-card:hover {
      transform: translateY(-4px) scale(1.01);
      border-color: rgba(212, 184, 134, 0.35);
      background: rgba(28, 28, 30, 0.65);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4),
                  0 0 30px rgba(212, 184, 134, 0.12), /* 은은한 골드 백글로우 */
                  inset 0 1px 1px rgba(255, 255, 255, 0.15);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }
    .link-icon-container {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: all 0.3s;
    }
    .link-icon { width: 20px; height: 20px; object-fit: contain; }
    .link-card:hover .link-icon-container {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.15);
    }
    .link-arrow {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.35);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .link-card:hover .link-arrow {
      color: #ffffff;
      transform: translate(2px, -2px);
    }

    .card-bottom {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-align: left;
    }
    .link-category {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--accent);
      text-transform: uppercase;
    }
    .link-text { font-size: 16px; font-weight: 500; color: #ffffff; }

    /* 모바일 타겟 768px 미만 세밀 튜닝 */
    @media (max-width: 767px) {
      .right-content {
        padding: 24px 16px;
      }
      .links-grid {
        margin-bottom: 48px;
        gap: 12px;
      }
      .link-card {
        min-height: 80px;
        padding: 14px 18px;
        border-radius: 16px;
      }
      .card-top {
        margin-bottom: 8px;
      }
      .link-icon-container {
        width: 32px;
        height: 32px;
        border-radius: 10px;
      }
      .link-icon {
        width: 16px;
        height: 16px;
      }
      .link-text {
        font-size: 14.5px;
      }
      .link-category {
        font-size: 9px;
      }
    }

    /* 예약 강조 카드 (네이버) */
    .link-card.primary {
      background: #ffffff;
      color: #000000;
      border: none;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25),
                  inset 0 1px 1px rgba(255, 255, 255, 0.6);
    }
    .link-card.primary:hover {
      background: #ffffff;
      transform: translateY(-4px) scale(1.01);
      box-shadow: 0 20px 45px rgba(255, 255, 255, 0.2),
                  inset 0 1px 1px rgba(255, 255, 255, 0.8);
    }
    .link-card.primary .link-text { color: #000000; font-weight: 600; }
    .link-card.primary .link-category { color: #86868b; }
    .link-card.primary .link-icon-container { background: rgba(0,0,0,0.04); border: none; }
    .link-card.primary .link-arrow { color: rgba(0,0,0,0.3); }
    .link-card.primary:hover .link-arrow { color: #000000; }

    /* === 갤러리 영역 === */
    .gallery-container {
      width: 100%;
      text-align: center;
    }
    .section-title {
      font-family: var(--font-serif);
      font-weight: 300;
      letter-spacing: 0.12em;
      font-size: 26px;
      margin-bottom: 30px;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .section-title::after, .section-title::before {
      content: "";
      width: 20px;
      height: 1px;
      background: rgba(255, 255, 255, 0.2);
    }

    /* 🖼️ 에디토리얼 잡지 스타일 갤러리 그리드 */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      width: 100%;
    }

    .photo-card {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      aspect-ratio: 4/3;
      background: #121214;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0,0,0,0.35);
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    /* 비대칭 에디토리얼 그리드 - 1번째, 4번째 등 매 3n+1번째 카드는 풀사이즈 배치 */
    .photo-card:nth-child(3n+1) {
      grid-column: span 2;
      aspect-ratio: 16 / 10;
    }

    .photo-card.loading::before {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(90deg, #121214 25%, #1a1a1f 50%, #121214 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite linear;
      z-index: 1;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .photo-card::after {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.5) 0%, transparent 70%);
      opacity: 0.8;
      z-index: 1;
      transition: opacity 0.3s;
    }
    .photo-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 45px rgba(0,0,0,0.55);
    }
    .photo-card img {
      width: 100%; height: 100%; object-fit: cover;
      opacity: 0;
      transition: opacity 0.5s ease, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .photo-card.loaded img {
      opacity: 1;
    }
    .photo-card:hover img {
      transform: scale(1.03);
    }



    /* 더보기 / 접기 컨트롤 버튼 컨테이너 */
    .gallery-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 40px;
    }
    .btn-control {
      padding: 12px 32px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: #ffffff;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-control:hover {
      border-color: #ffffff;
      background: #ffffff;
      color: #000000;
      transform: translateY(-2px);
    }
    #hideBtn {
      background: transparent;
      color: rgba(255, 255, 255, 0.5);
    }
    #hideBtn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }

    /* 푸터 */
    footer {
      text-align: center;
      padding: 80px 20px 40px;
      font-size: 11px;
      color: #636366;
      border-top: 1px solid rgba(255,255,255,0.05);
      line-height: 1.8;
      width: 100%;
    }

    /* 라이트박스 */
    #lightbox {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      display: none; justify-content: center; align-items: center;
      opacity: 0; transition: opacity 0.4s ease;
    }
    #lightbox.show { display: flex; opacity: 1; }
    #lightbox img {
      max-width: 92vw; max-height: 85vh;
      border-radius: 16px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.8);
      transform: scale(0.95);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #lightbox.show img { transform: scale(1); }
    #lightbox-close {
      position: absolute; top: 30px; right: 30px;
      color: rgba(255,255,255,0.7); font-size: 20px;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
      width: 48px; height: 48px; border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.3s;
    }
    #lightbox-close:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.18);
      transform: scale(1.05);
    }
  </style>
</head>

            <div class="photo-card loaded reveal" onclick="openLightbox('https://cdn.jsdelivr.net/gh/Junkyuh/subooksubook-assets/webp_only/DJI_20251114144003_0542_D.webp')">
              <img src="https://cdn.jsdelivr.net/gh/Junkyuh/subooksubook-assets/webp_only/DJI_20251114144003_0542_D.webp" alt="수북수북 공간">
            </div>
            <div class="photo-card loaded reveal" onclick="openLightbox('https://cdn.jsdelivr.net/gh/Junkyuh/subooksubook-assets/webp_only/SDP01298.webp')">
              <img src="https://cdn.jsdelivr.net/gh/Junkyuh/subooksubook-assets/webp_only/SDP01298.webp" alt="수북수북 공간" loading="lazy">
            </div>
            <div class="photo-card loaded reveal" onclick="openLightbox('https://cdn.jsdelivr.net/gh/Junkyuh/subooksubook-assets/webp_only/SDP01299.webp')">
              <img src="https://cdn.jsdelivr.net/gh/Junkyuh/subooksubook-assets/webp_only/SDP01299.webp" alt="수북수북 공간" loading="lazy">
            </div>
          </div>
          
          <div class="gallery-actions">
            <button id="hideBtn" class="btn-control" style="display: none;">사진 접기</button>
            <button id="loadMoreBtn" class="btn-control">사진 더 보기</button>
          </div>
        </section>

        <footer class="reveal">
          <div><strong>수북수북</strong> | 대표: 최준혁</div>
          <div style="margin-top:4px; opacity:0.7;">사업자번호: 484-34-01667</div>
          <div style="margin-top:16px;">© 2025 SubookSubook. All rights reserved.</div>
        </footer>

      </div>
    </div>
  </div>

  <div id="lightbox">
    <button id="lightbox-close">✕</button>
    <img id="lightbox-img" src="" alt="">
  </div>

  <script>
    (function () {
      // 1. CSS 골드 파티클 동적 생성 로직
      const particlesContainer = document.querySelector('.particles-overlay');
      if (particlesContainer) {
        for (let i = 0; i < 20; i++) {
          const particle = document.createElement('div');
          particle.className = 'gold-particle';
          particle.style.left = `${Math.random() * 100}%`;
          particle.style.animationDuration = `${7 + Math.random() * 8}s`;
          particle.style.animationDelay = `${Math.random() * 9}s`;
          const size = 1.5 + Math.random() * 3.5;
          particle.style.width = `${size}px`;
          particle.style.height = `${size}px`;
          particlesContainer.appendChild(particle);
        }
      }



      const base = "https://cdn.jsdelivr.net/gh/Junkyuh/subooksubook-assets/webp_only/";
      const grid = document.getElementById("gallery-grid");
      const loadMoreBtn = document.getElementById("loadMoreBtn");
      const hideBtn = document.getElementById("hideBtn");
      
      const ids = [];
      ids.push("DJI_20251114143734_0533_D","DJI_20251114143838_0537_D","DJI_20251114143859_0538_D","DJI_20251114144003_0542_D");
      
      const missingIds = new Set(["SDP01329", "SDP01384", "SDP01386", "SDP01396", "SDP01397", "SDP01404", "SDP01405"]);
      for (let n = 1298; n <= 1406; n++) {
        const id = `SDP0${n}`;
        if (!missingIds.has(id)) {
          ids.push(id);
        }
      }

      let currentIndex = 6; // 최초 6장은 정적 HTML로 선배치되어 index 6부터 로딩 시작
      const batchSize = 6; // 브라우저 동시 HTTP 커넥션 제한(6개)에 최적화하여 6장씩 충돌 없이 빠른 로딩
      const initialBatchSize = 6; // 접었을 때 복원 크기

      // Intersection Observer 순차 reveal 효과용
      const revealOptions = {
        threshold: 0.05,
        root: window.innerWidth >= 1024 ? document.querySelector('.right-panel') : null,
        rootMargin: "0px 0px -40px 0px"
      };

      const observer = new IntersectionObserver((entries, obs) => {
        entries.forEach((entry, idx) => {
          if (entry.isIntersecting) {
            setTimeout(() => {
              entry.target.classList.add('visible');
            }, idx * 40); // 딜레이를 40ms로 절반 축소하여 더 기분 좋은 속도감 제공
            obs.unobserve(entry.target);
          }
        });
      }, revealOptions);

      // 404 에러를 유발하는 이미지 ID들 목록 (사전 탐지하여 즉시 -편집.webp 로드)
      const fallbackIds = new Set(["SDP01309", "SDP01342", "SDP01344", "SDP01347", "SDP01349", "SDP01354", "SDP01358", "SDP01364", "SDP01365", "SDP01366"]);

      function loadBatch(size) {
        const targetSize = size || batchSize;
        const slice = ids.slice(currentIndex, currentIndex + targetSize);
        
        slice.forEach(id => {
          const card = document.createElement("div");
          card.className = "photo-card loading reveal";

          const img = document.createElement("img");
          img.loading = "lazy"; // 브라우저 뷰포트 감지 지연 로딩 적용
          
          // 404 에러가 나는 ID는 곧바로 편집본을 요청하여 404 지연(대기 시간) 제거
          const suffix = fallbackIds.has(id) ? "-편집" : "";
          img.src = base + id + suffix + ".webp";
          
          img.onload = () => {
            card.classList.remove("loading");
            card.classList.add("loaded");
          };
          
          let attempts = 0;
          img.onerror = () => {
            attempts++;
            if (attempts === 1) {
              img.src = base + id + "-편집.webp";
            } else {
              card.remove();
            }
          };
          
          card.onclick = () => openLightbox(img.src);
          card.appendChild(img);



          grid.appendChild(card);
          observer.observe(card); // 스크롤 reveal 바인딩
        });

        currentIndex += slice.length;
        
        if (currentIndex > initialBatchSize) {
          hideBtn.style.display = "block";
        }
        if (currentIndex >= ids.length) {
          loadMoreBtn.style.display = "none";
        }
      }

      hideBtn.onclick = () => {
        grid.innerHTML = "";
        currentIndex = 0;
        loadBatch(initialBatchSize);
        hideBtn.style.display = "none";
        loadMoreBtn.style.display = "block";
        
        if (window.innerWidth >= 1024) {
          document.querySelector(".right-panel").scrollTop = document.querySelector(".gallery-container").offsetTop - 60;
        } else {
          window.scrollTo({ top: document.getElementById("gallery-grid").offsetTop - 60, behavior: 'smooth' });
        }
      };

      loadMoreBtn.onclick = () => loadBatch(batchSize);
      
      // 정적 요소들 및 선배치된 사진 카드들 reveal 바인딩
      document.querySelectorAll('.links-grid .reveal, .gallery-container.reveal, .photo-card.reveal, footer.reveal').forEach(el => {
        observer.observe(el);
      });

      // 3. 스크롤에 따른 배경 이미지 패럴랙스 (가벼운 CSS Transform 제어)
      const rightPanel = document.querySelector('.right-panel');
      const bgLayer = document.querySelector('.bg-layer');

      function handleScroll() {
        const scrollTop = window.innerWidth >= 1024 ? rightPanel.scrollTop : window.scrollY;
        const scale = 1.03 + scrollTop * 0.00008;
        const brightness = Math.max(0.12, 0.3 - scrollTop * 0.00015);
        
        bgLayer.style.transform = `scale(${scale})`;
        bgLayer.style.filter = `brightness(${brightness}) contrast(1.15)`;
      }

      if (window.innerWidth >= 1024) {
        rightPanel.addEventListener('scroll', handleScroll, { passive: true });
      } else {
        window.addEventListener('scroll', handleScroll, { passive: true });
      }

      window.addEventListener('resize', () => {
        rightPanel.removeEventListener('scroll', handleScroll);
        window.removeEventListener('scroll', handleScroll);
        if (window.innerWidth >= 1024) {
          rightPanel.addEventListener('scroll', handleScroll, { passive: true });
        } else {
          window.addEventListener('scroll', handleScroll, { passive: true });
        }
      }, { passive: true });

    })();

    // 라이트박스
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightbox-img");
    
    function openLightbox(src) {
      lightboxImg.src = src;
      lightbox.classList.add("show");
      document.body.style.overflow = "hidden";
    }
    
    document.getElementById("lightbox-close").onclick = () => {
      lightbox.classList.remove("show");
      document.body.style.overflow = "";
    }
    
    lightbox.onclick = (e) => {
      if(e.target === lightbox) {
        lightbox.classList.remove("show");
        document.body.style.overflow = "";
      }
    }
  </script>
</body>
