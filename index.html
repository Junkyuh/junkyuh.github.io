<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="description" content="옥천의 고요한 쉼터, 수북수북">
  <meta property="og:title" content="수북수북 | Subook Book">
  <meta property="og:image" content="https://cdn.jsdelivr.net/gh/Junkyuh/subooksubook-assets/logo.png">
  <title>수북수북 | SubookSubook</title>

  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;500&display=swap" rel="stylesheet">

  <style>
    /* === 초기화 및 변수 === */
    :root {
      --primary: #f5f5f7;
      --background: #000000;
      --accent: #d4b886;
      --accent-rgb: 212, 184, 134;
      --card-bg: rgba(22, 22, 23, 0.55);
      --card-border: rgba(255, 255, 255, 0.08);
      --font-serif: 'Noto Serif KR', serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--primary);
      background-color: var(--background);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.02em;
    }

    /* === 파격적인 스플릿 레이아웃 설계 === */
    .container {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    
    @media (min-width: 1024px) {
      .container {
        flex-direction: row;
        height: 100vh;
        overflow: hidden;
      }
    }

    /* 왼쪽 고정 영역 (히어로 & 비주얼) */
    .left-panel {
      position: relative;
      padding: 60px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      min-height: 40vh;
    }

    @media (min-width: 1024px) {
      .left-panel {
        width: 45%;
        height: 100vh;
        min-height: auto;
        padding: 80px;
        position: sticky;
        top: 0;
      }
    }

    /* 배경 레이어 (드론샷) */
    .bg-layer {
      position: absolute; inset: 0;
      z-index: -1;
      background-image: url('https://cdn.jsdelivr.net/gh/Junkyuh/subooksubook-assets/webp_only/DJI_20251114143734_0533_D.webp');
      background-size: cover;
      background-position: center;
      filter: brightness(0.3) contrast(1.15);
      transform: scale(1.03);
      animation: slowZoom 40s infinite alternate ease-in-out;
    }
    @keyframes slowZoom { from { transform: scale(1.02); } to { transform: scale(1.1); } }

    /* 로고 & 타이틀 */
    .logo-area {
      margin-bottom: 16px;
    }
    .logo-img {
      width: 64px;
      height: auto;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.4));
    }
    .title-area span {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--accent);
      margin-bottom: 8px;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(30px, 5.5vw, 48px);
      font-weight: 300;
      line-height: 1.25;
      color: #ffffff;
      text-shadow: 0 4px 30px rgba(0, 0, 0, 0.7);
    }

    /* 오른쪽 스크롤 영역 */
    .right-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #000000;
    }

    @media (min-width: 1024px) {
      .right-panel {
        height: 100vh;
        overflow-y: auto;
        scroll-behavior: smooth;
        padding-right: 8px;
      }
      /* 스크롤바 디자인 */
      .right-panel::-webkit-scrollbar { width: 6px; }
      .right-panel::-webkit-scrollbar-track { background: #000; }
      .right-panel::-webkit-scrollbar-thumb { background: #222; border-radius: 3px; }
      .right-panel::-webkit-scrollbar-thumb:hover { background: #333; }
    }

    /* 오른쪽 패널 콘텐츠 패딩 */
    .right-content {
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    /* === 링크 카드 그리드 === */
    .links-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      width: 100%;
      margin-bottom: 60px;
    }

    @media (min-width: 640px) {
      .links-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 18px;
      }
    }

    .link-card {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 110px;
      padding: 20px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      text-decoration: none;
      color: #ffffff;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.25);
    }
    .link-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.12), transparent);
    }
    .link-card:hover {
      transform: translateY(-4px);
      border-color: rgba(255, 255, 255, 0.15);
      background: rgba(28, 28, 30, 0.65);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }
    .link-icon-container {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: all 0.3s;
    }
    .link-icon { width: 20px; height: 20px; object-fit: contain; }
    .link-card:hover .link-icon-container {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.15);
    }
    .link-arrow {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.35);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .link-card:hover .link-arrow {
      color: #ffffff;
      transform: translate(2px, -2px);
    }

    .card-bottom {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-align: left;
    }
    .link-category {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--accent);
      text-transform: uppercase;
    }
    .link-text { font-size: 16px; font-weight: 500; color: #ffffff; }

    /* 모바일 타겟 768px 미만 세밀 튜닝 */
    @media (max-width: 767px) {
      .right-content {
        padding: 24px 16px;
      }
      .links-grid {
        margin-bottom: 48px;
        gap: 12px;
      }
      .link-card {
        min-height: 80px; /* 높이를 슬림하게 조율 */
        padding: 14px 18px;
        border-radius: 16px;
      }
      .card-top {
        margin-bottom: 8px;
      }
      .link-icon-container {
        width: 32px;
        height: 32px;
        border-radius: 10px;
      }
      .link-icon {
        width: 16px;
        height: 16px;
      }
      .link-text {
        font-size: 14.5px; /* 약간 더 콤팩트한 본문 글꼴 */
      }
      .link-category {
        font-size: 9px;
      }
    }

    /* 예약 강조 카드 (네이버) */
    .link-card.primary {
      background: #ffffff;
      color: #000000;
      border: none;
    }
    .link-card.primary:hover {
      background: #ffffff;
      transform: translateY(-5px);
      box-shadow: 0 16px 40px rgba(255, 255, 255, 0.15);
    }
    .link-card.primary .link-text { color: #000000; font-weight: 600; }
    .link-card.primary .link-category { color: #86868b; }
    .link-card.primary .link-icon-container { background: rgba(0,0,0,0.04); border: none; }
    .link-card.primary .link-arrow { color: rgba(0,0,0,0.3); }
    .link-card.primary:hover .link-arrow { color: #000000; }

    /* === 갤러리 영역 === */
    .gallery-container {
      width: 100%;
      text-align: center;
    }
    .section-title {
      font-family: var(--font-serif);
      font-weight: 300;
      letter-spacing: 0.12em;
      font-size: 26px;
      margin-bottom: 30px;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .section-title::after, .section-title::before {
      content: "";
      width: 20px;
      height: 1px;
      background: rgba(255, 255, 255, 0.2);
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      width: 100%;
    }

    /* 🖼️ 이미지 로딩 뼈대 (Skeleton Shimmer Effect) */
    .photo-card {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      aspect-ratio: 4/3;
      background: #121214;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .photo-card.loading::before {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(90deg, #121214 25%, #1a1a1f 50%, #121214 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite linear;
      z-index: 1;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .photo-card::after {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.3) 0%, transparent 60%);
      opacity: 0.8;
    }
    .photo-card:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 16px 36px rgba(0,0,0,0.6);
      z-index: 5;
    }
    .photo-card img {
      width: 100%; height: 100%; object-fit: cover;
      opacity: 0;
      transition: opacity 0.5s ease, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .photo-card.loaded img {
      opacity: 1;
    }
    .photo-card:hover img {
      transform: scale(1.04);
    }

    /* 더보기 / 접기 컨트롤 버튼 컨테이너 */
    .gallery-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 40px;
    }
    .btn-control {
      padding: 12px 32px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: #ffffff;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-control:hover {
      border-color: #ffffff;
      background: #ffffff;
      color: #000000;
      transform: translateY(-2px);
    }
    #hideBtn {
      background: transparent;
      color: rgba(255, 255, 255, 0.5);
    }
    #hideBtn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }

    /* 푸터 */
    footer {
      text-align: center;
      padding: 80px 20px 40px;
      font-size: 11px;
      color: #636366;
      border-top: 1px solid rgba(255,255,255,0.05);
      line-height: 1.8;
      width: 100%;
    }

    /* 라이트박스 */
    #lightbox {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      display: none; justify-content: center; align-items: center;
      opacity: 0; transition: opacity 0.4s ease;
    }
    #lightbox.show { display: flex; opacity: 1; }
    #lightbox img {
      max-width: 92vw; max-height: 85vh;
      border-radius: 16px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.8);
      transform: scale(0.95);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #lightbox.show img { transform: scale(1); }
    #lightbox-close {
      position: absolute; top: 30px; right: 30px;
      color: rgba(255,255,255,0.7); font-size: 20px;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
      width: 48px; height: 48px; border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.3s;
    }
    #lightbox-close:hover {
      color: #ffffff;
      background: rgba(255,255,255,0.18);
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 왼쪽: 고정 히어로 영역 -->
    <div class="left-panel">
      <div class="bg-layer"></div>
      <div class="logo-area">
        <img src="https://cdn.jsdelivr.net/gh/Junkyuh/subooksubook-assets/logo.png" alt="수북수북 로고" class="logo-img">
      </div>
      <div class="title-area">
        <span>SUBOOK SUBOOK</span>
        <h1>옥천 수북수북</h1>
      </div>
    </div>

    <!-- 오른쪽: 스크롤 링크 및 콘텐츠 영역 -->
    <div class="right-panel">
      <div class="right-content">
        
        <nav class="links-grid">
          <a href="https://booking.naver.com/booking/3/bizes/1537541" target="_blank" class="link-card primary">
            <div class="card-top">
              <div class="link-icon-container">
                <img src="https://cdn.jsdelivr.net/gh/Junkyuh/subooksubook-assets/Naver_icon_2018.svg" class="link-icon" alt="네이버">
              </div>
              <span class="link-arrow">↗</span>
            </div>
            <div class="card-bottom">
              <span class="link-category">Reservation</span>
              <span class="link-text">네이버 예약하기</span>
            </div>
          </a>

          <a href="https://airbnb.co.kr/h/subook" target="_blank" class="link-card">
            <div class="card-top">
              <div class="link-icon-container">
                <img src="https://upload.wikimedia.org/wikipedia/commons/6/69/Airbnb_Logo_B%C3%A9lo.svg" class="link-icon" alt="에어비앤비">
              </div>
              <span class="link-arrow">↗</span>
            </div>
            <div class="card-bottom">
              <span class="link-category">Airbnb</span>
              <span class="link-text">Airbnb 예약하기</span>
            </div>
          </a>

          <a href="https://www.instagram.com/subook.stay/" target="_blank" class="link-card">
            <div class="card-top">
              <div class="link-icon-container">
                <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" class="link-icon" alt="인스타그램">
              </div>
              <span class="link-arrow">↗</span>
            </div>
            <div class="card-bottom">
              <span class="link-category">Social</span>
              <span class="link-text">Instagram 둘러보기</span>
            </div>
          </a>
          
          <a href="https://www.liveanywhere.me/accommodations/45342?web-mode=true" target="_blank" class="link-card">
            <div class="card-top">
              <div class="link-icon-container">
                <img src="https://cdn.jsdelivr.net/gh/Junkyuh/subooksubook-assets/LiveAnywhere.png" class="link-icon" alt="리브애니웨어">
              </div>
              <span class="link-arrow">↗</span>
            </div>
            <div class="card-bottom">
              <span class="link-category">Long Stay</span>
              <span class="link-text">한 달 살기 신청</span>
            </div>
          </a>
        </nav>

        <section class="gallery-container">
          <div class="section-title">Gallery</div>
          <div class="gallery-grid" id="gallery-grid"></div>
          
          <div class="gallery-actions">
            <button id="hideBtn" class="btn-control" style="display: none;">사진 접기</button>
            <button id="loadMoreBtn" class="btn-control">사진 더 보기</button>
          </div>
        </section>

        <footer>
          <div><strong>수북수북</strong> | 대표: 최준혁</div>
          <div style="margin-top:4px; opacity:0.7;">사업자번호: 484-34-01667</div>
          <div style="margin-top:16px;">© 2025 SubookSubook. All rights reserved.</div>
        </footer>

      </div>
    </div>
  </div>

  <div id="lightbox">
    <button id="lightbox-close">✕</button>
    <img id="lightbox-img" src="" alt="">
  </div>

  <script>
    (function () {
      const base = "https://cdn.jsdelivr.net/gh/Junkyuh/subooksubook-assets/webp_only/";
      const grid = document.getElementById("gallery-grid");
      const loadMoreBtn = document.getElementById("loadMoreBtn");
      const hideBtn = document.getElementById("hideBtn");
      
      const ids = [];
      ids.push("DJI_20251114143734_0533_D","DJI_20251114143838_0537_D","DJI_20251114143859_0538_D","DJI_20251114144003_0542_D");
      
      // 존재하지 않는 이미지 ID 목록
      const missingIds = new Set(["SDP01329", "SDP01384", "SDP01386", "SDP01396", "SDP01397", "SDP01404", "SDP01405"]);
      for (let n = 1298; n <= 1406; n++) {
        const id = `SDP0${n}`;
        if (!missingIds.has(id)) {
          ids.push(id);
        }
      }

      let currentIndex = 0;
      const batchSize = 10;
      const initialBatchSize = 6; // 최초엔 6장만 로드

      function loadBatch(size) {
        const targetSize = size || batchSize;
        const slice = ids.slice(currentIndex, currentIndex + targetSize);
        
        slice.forEach(id => {
          const card = document.createElement("div");
          card.className = "photo-card loading";

          const img = document.createElement("img");
          img.src = base + id + ".webp";
          
          img.onload = () => {
            card.classList.remove("loading");
            card.classList.add("loaded");
          };
          
          let attempts = 0;
          img.onerror = () => {
            attempts++;
            if (attempts === 1) {
              img.src = base + id + "-편집.webp";
            } else {
              card.remove();
            }
          };
          
          card.onclick = () => openLightbox(img.src);
          card.appendChild(img);
          grid.appendChild(card);
        });

        currentIndex += slice.length;
        
        if (currentIndex > initialBatchSize) {
          hideBtn.style.display = "block";
        }
        if (currentIndex >= ids.length) {
          loadMoreBtn.style.display = "none";
        }
      }

      hideBtn.onclick = () => {
        grid.innerHTML = "";
        currentIndex = 0;
        loadBatch(initialBatchSize);
        hideBtn.style.display = "none";
        loadMoreBtn.style.display = "block";
        
        if (window.innerWidth >= 1024) {
          document.querySelector(".right-panel").scrollTop = document.querySelector(".gallery-container").offsetTop - 60;
        } else {
          window.scrollTo({ top: document.getElementById("gallery-grid").offsetTop - 60, behavior: 'smooth' });
        }
      };

      loadMoreBtn.onclick = () => loadBatch(batchSize);
      loadBatch(initialBatchSize);
    })();

    // 라이트박스
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightbox-img");
    
    function openLightbox(src) {
      lightboxImg.src = src;
      lightbox.classList.add("show");
      document.body.style.overflow = "hidden";
    }
    
    document.getElementById("lightbox-close").onclick = () => {
      lightbox.classList.remove("show");
      document.body.style.overflow = "";
    }
    
    lightbox.onclick = (e) => {
      if(e.target === lightbox) {
        lightbox.classList.remove("show");
        document.body.style.overflow = "";
      }
    }
  </script>
</body>
</html>
