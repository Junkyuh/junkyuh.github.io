<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>수북수북 관리자</title>
  <style>
    * { margin: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
      background: #0f0f0e; color: #f4f1ea;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .wrap { width: 100%; max-width: 560px; }
    h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 4px; }
    .sub { font-size: 13px; color: #8a857a; margin-bottom: 28px; }
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; transition: opacity .3s; }
    @media (max-width: 480px) { .cards { grid-template-columns: 1fr; } }
    .card { background: #1a1916; border: 1px solid #2a2823; border-radius: 14px; padding: 20px 18px; }
    .card .label { font-size: 12px; color: #8a857a; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
    .card .label::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #c8a45e; }
    .card .num { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
    .foot { margin-top: 24px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #8a857a; }
    button {
      background: #c8a45e; color: #14120e; border: 0; border-radius: 8px;
      padding: 8px 16px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    button:hover { filter: brightness(1.08); }
    #error { color: #d96a5b; font-size: 12px; margin-top: 12px; }
  </style>
</head>
<body>
  <main class="wrap">
    <!-- Login gate -->
    <div id="gate">
      <h1>수북수북 관리자</h1>
      <p class="sub">암호를 입력하세요</p>
      <input id="pw" type="password" placeholder="암호" autocomplete="current-password"
        style="width:100%;padding:12px 14px;background:#1a1916;border:1px solid #2a2823;border-radius:10px;color:#f4f1ea;font-size:14px;outline:none;" />
      <div style="margin-top:12px;display:flex;gap:8px;align-items:center;">
        <button id="login-btn" style="padding:10px 20px;">열기</button>
        <span id="login-error" style="color:#d96a5b;font-size:12px;"></span>
      </div>
    </div>

    <!-- Dashboard (hidden until login) -->
    <div id="dash" style="display:none;">
      <h1>수북수북 방문자</h1>
      <p class="sub">sub00k.com 트래픽 카운트</p>
      <div id="cards" class="cards opacity-40">
        <div class="card"><div class="label">오늘</div><div class="num" id="today">–</div></div>
        <div class="card"><div class="label">이번 달</div><div class="num" id="month">–</div></div>
        <div class="card"><div class="label">누적</div><div class="num" id="total">–</div></div>
      </div>
      <div class="foot">
        <span>갱신: <span id="updated">–</span></span>
        <button id="refresh">새로고침</button>
      </div>
      <div id="error"></div>
    </div>
  </main>
  <script src="./admin.js"></script>
</body>
</html>
